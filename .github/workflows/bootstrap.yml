name: Import FOCUS project and queue Windows build

on:
  push:
    paths:
      - 'bootstrap/source.b64'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore original FOCUS source
        run: node scripts/import-source.cjs
      - name: Validate source
        run: |
          npm run check
          npm test
      - name: Commit project files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "feat: import FOCUS v1.1.0 desktop sources"
            git push origin HEAD:main
          fi
      - name: Create first version tag
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --tags origin refs/tags/v1.1.0 >/dev/null 2>&1; then
            git tag v1.1.0
            git push origin v1.1.0
          fi
      - name: Start first Windows installer build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo ${{ github.repository }} --ref v1.1.0
