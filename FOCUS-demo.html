<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#061f1b"><title>FOCUS — Stay Focused / Демо v1.1.0</title>
<style>:root { color-scheme:dark; --bg:#041c17; --fg:#e9f5ee; --muted:#91aaa1; --line:rgba(176,223,198,.13); --border:rgba(192,237,211,.17); --glass:rgba(11,41,33,.65); --subglass:rgba(16,52,42,.56); --mint:#b0e5b9; --green:#8bcba4; --soft:#b9d5c6; }
* {box-sizing:border-box}
html,body{margin:0;min-height:100%; background:#051e19;}
body{color:var(--fg);font-family:'Inter Tight','Segoe UI Variable','Segoe UI',system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #b9eac5;outline-offset:3px}
::selection{background:rgba(149,217,175,.4)}
.aura,.graph-paper{position:fixed;z-index:-2;pointer-events:none;inset:0}
.aura-one{background:radial-gradient(ellipse 55% 60% at 9% 8%,rgba(19,105,75,.43),transparent 70%),radial-gradient(ellipse 50% 60% at 77% 96%,rgba(11,110,79,.32),transparent 74%),linear-gradient(135deg,#051b16,#031b16 58%,#05241d)}
.aura-two{background:radial-gradient(ellipse 34% 34% at 54% 35%,rgba(35,123,94,.13),transparent),radial-gradient(ellipse 42% 35% at 17% 92%,rgba(64,158,105,.12),transparent)}
.graph-paper{opacity:.24;background-image:linear-gradient(to right,rgba(167,226,192,.08) 1px,transparent 1px),linear-gradient(to bottom,rgba(167,226,192,.08) 1px,transparent 1px);background-size:32px 32px;mask-image:linear-gradient(90deg,transparent,#000 17%,#000 85%,transparent)}
#app{min-height:100vh;padding:22px}
.shell{max-width:1540px;min-height:calc(100vh - 44px);margin:0 auto;display:grid;grid-template-columns:238px minmax(0,1fr);gap:20px}
.sidebar,.panel,.hero,.tile{border:1px solid var(--border);background:linear-gradient(153deg,rgba(16,57,44,.76),rgba(8,34,27,.7));box-shadow:0 16px 45px rgba(0,10,7,.12),inset 0 1px rgba(222,255,228,.035);backdrop-filter:blur(32px)}
.sidebar{padding:29px 16px 18px;border-radius:24px;display:flex;flex-direction:column;gap:0;position:sticky;top:22px;height:calc(100vh - 44px);min-height:690px}
.brand{display:flex;gap:12px;align-items:center;padding:0 11px 32px}
.brand-icon{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#b8ebc8,#5c9d7e);display:grid;place-items:center;color:#123b2c;font-weight:900;font-size:25px;line-height:1;box-shadow:0 7px 23px rgba(90,201,142,.18)}
.brand-main{font-weight:770;letter-spacing:.09em;font-size:17px;line-height:1.1}
.brand-sub{color:#7d9e91;font-size:10px;letter-spacing:.15em;text-transform:uppercase;margin-top:6px}
.nav-head{padding:12px 14px 9px;letter-spacing:.15em;text-transform:uppercase;color:#6d9383;font-size:10px;font-weight:750}
.nav{display:flex;flex-direction:column;gap:5px}
.nav-item{border:1px solid transparent;background:none;color:#98b2a5;display:flex;align-items:center;gap:12px;text-align:left;padding:13px 14px;border-radius:12px;transition:.2s;font-weight:550;width:100%}
.nav-item:hover{background:rgba(162,227,184,.08);color:#e9f5ed}
.nav-item.active{background:linear-gradient(100deg,rgba(156,225,180,.17),rgba(146,217,178,.07));border-color:rgba(167,231,188,.15);color:#f0fbf2}
.nav-item svg{width:19px;height:19px;stroke-width:1.8;opacity:.9}
.nav-item.active svg{color:#b6e9be}
.sidebar-spacer{flex:1}
.side-quote{border:1px solid rgba(158,222,180,.12);background:rgba(11,44,34,.52);border-radius:16px;padding:18px;margin:12px 4px 20px;position:relative;overflow:hidden}
.side-quote:before{content:'';position:absolute;inset:-25% -35%;background:radial-gradient(ellipse at 0% 0%,rgba(69,144,95,.17),transparent 65%);pointer-events:none}
.side-quote .quote-icon{font-family:Georgia,serif;font-size:30px;color:#b8e2c5;line-height:1}
.side-quote .quote-text{font:17px/1.45 Georgia,serif;color:#d1e3d5;position:relative;margin:4px 0 10px}
.side-quote .quote-cap{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#73998a}
.profile{display:flex;align-items:center;gap:10px;padding:12px 8px 0;border-top:1px solid var(--line)}
.profile-avatar{border-radius:50%;height:33px;width:33px;display:grid;place-items:center;background:linear-gradient(145deg,#afe1bd,#4e9877);color:#0b3024;font-weight:750}
.profile strong{display:block;font-size:12px;font-weight:680}
.profile span{color:#819e92;font-size:10px;display:block;margin-top:3px}
.main{padding:12px 0 42px;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;min-height:58px;margin-bottom:23px;padding:0 4px}
.eyebrow{font-size:10px;font-weight:730;letter-spacing:.17em;color:#7aaf94;text-transform:uppercase}
.page-title{font-size:29px;line-height:1.22;letter-spacing:-.045em;margin:5px 0 0;font-weight:650}
.top-meta{display:flex;align-items:center;gap:13px;color:#a7c0b0;font-size:12px}
.top-date{border:1px solid rgba(180,230,195,.15);border-radius:100px;background:rgba(16,54,40,.65);padding:10px 15px;display:flex;gap:8px;align-items:center}
.top-date svg{height:14px;width:14px;color:#8ebba1}
.online-indicator{width:7px;height:7px;background:#9adfb0;border-radius:50%;box-shadow:0 0 14px rgba(155,225,172,.8)}
.hero{border-radius:23px;position:relative;min-height:233px;overflow:hidden;padding:32px 37px;display:flex;justify-content:space-between;align-items:center;background:radial-gradient(ellipse 46% 80% at 74% 62%,rgba(72,154,111,.27),transparent 70%),radial-gradient(ellipse 60% 120% at -10% -40%,rgba(60,155,98,.2),transparent 75%),linear-gradient(110deg,rgba(9,47,36,.86),rgba(7,30,25,.8))}
.hero:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(173,233,199,.10) 0px,rgba(173,233,199,.10) 1px,transparent 1px,transparent 27px),repeating-linear-gradient(0deg,rgba(173,233,199,.08) 0px,rgba(173,233,199,.08) 1px,transparent 1px,transparent 27px);opacity:.32;mask-image:linear-gradient(90deg,transparent,black 30%,black 80%,transparent)}
.hero:after{content:'';position:absolute;width:760px;height:760px;border:1px solid rgba(169,216,183,.12);border-radius:50%;right:-240px;top:-290px;box-shadow:0 0 0 89px rgba(166,219,188,.022),0 0 0 180px rgba(166,219,188,.022),0 0 0 270px rgba(166,219,188,.015);pointer-events:none}
.hero-text,.hero-focus{position:relative;z-index:1}
.hero .date-label{display:inline-flex;align-items:center;gap:8px;font-weight:720;letter-spacing:.16em;text-transform:uppercase;color:#9bd9ad;font-size:10px}
.hero h2{font-size:clamp(32px,3.4vw,52px);font-weight:630;line-height:1.16;letter-spacing:-.045em;margin:16px 0 14px;max-width:620px}
.hero p{color:#a7c7b6;margin:0;font-size:13px;line-height:1.6;max-width:450px}
.hero-focus{font:clamp(29px,2.9vw,43px)/1.2 Georgia,serif;color:rgba(220,241,225,.91);white-space:nowrap;letter-spacing:-.045em;margin-right:20px;text-shadow:0 5px 26px rgba(5,20,14,.2)}
.section-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:28px 0 15px}
.section-title{font-size:18px;font-weight:630;letter-spacing:-.025em;margin:0}
.section-sub{color:#86a79a;font-size:12px;margin-top:5px}
.inline-link{display:inline-flex;align-items:center;gap:6px;background:transparent;border:0;color:#b7e5c2;font-size:12px;padding:8px 2px}
.inline-link:hover{color:#fff}
.inline-link svg{width:15px;height:15px}
.metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:15px}
.panel,.tile{border-radius:19px;padding:22px}
.panel{position:relative;overflow:hidden}
.panel-heading{font-size:11px;color:#97b7a7;font-weight:550;letter-spacing:.02em}
.metric-value{font-size:35px;line-height:1.1;font-weight:630;letter-spacing:-.06em;margin:14px 0 5px}
.metric-value small{font-size:16px;color:#93bc9f;font-weight:400;letter-spacing:0}
.metric-detail{font-size:11px;color:#83a394;margin-top:10px}
.metric-bubble{position:absolute;right:18px;top:18px;width:32px;height:32px;display:grid;place-items:center;border-radius:10px;background:rgba(155,222,182,.09);color:#b4ddbc}
.metric-bubble svg{width:16px;height:16px}
.meter{height:7px;background:rgba(170,225,191,.12);border-radius:15px;margin-top:16px;overflow:hidden}
.meter>span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#5dbb91,#c2eec3);transition:width .3s;max-width:100%;min-width:0}
.metric-note{font-size:10px;margin-top:8px;color:#96b5a6;display:flex;justify-content:space-between}
.today-layout{display:grid;grid-template-columns:minmax(0,1.46fr) minmax(288px,.8fr);gap:15px;align-items:stretch}
.panel-label{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.panel-label strong{font-size:14px;font-weight:610}
.panel-label span{font-size:11px;color:#8dad9a}
.habit-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.habit{min-height:71px;background:rgba(126,189,151,.045);border:1px solid rgba(167,227,190,.095);border-radius:13px;display:flex;align-items:center;gap:13px;padding:13px;transition:.18s}
.habit:hover{background:rgba(136,199,161,.08);border-color:rgba(182,232,193,.17)}
.habit-icon{width:33px;height:33px;flex:0 0 33px;border:1px solid rgba(166,225,182,.12);border-radius:10px;background:rgba(170,217,177,.07);display:grid;place-items:center;color:#a5d3ad}
.habit-icon svg{width:16px;height:16px;stroke-width:1.7}
.habit-content{flex:1;min-width:0}
.habit-name{font-size:12px;font-weight:570;margin-bottom:5px}
.habit-meta{font-size:10px;color:#80a18e}
.habit-check{width:23px;height:23px;border:1px solid rgba(170,232,190,.27);background:rgba(121,196,142,.06);border-radius:50%;color:transparent;display:grid;place-items:center;flex:0 0 auto;padding:0;transition:.15s}
.habit-check.checked{background:#afd9b6;color:#12432f;border-color:#afd9b6}
.habit-check svg{width:14px;height:14px}
.habit-input{width:73px;text-align:right;background:rgba(9,34,27,.6);border:1px solid rgba(160,216,184,.15);border-radius:9px;color:#e3f3e8;padding:9px 7px;font-size:12px}
.habit-input.time{width:87px;font-size:12px}
.habit select.habit-input{width:89px;text-align:left}
input[type=number]::-webkit-inner-spin-button{opacity:.25}
input[type=date],input[type=time]{color-scheme:dark}
.daily-footer{display:flex;gap:13px;align-items:center;margin-top:18px;padding-top:15px;border-top:1px solid var(--line)}
.track-dots{display:flex;gap:6px;flex:1}
.track-dots span{display:block;height:7px;flex:1;border-radius:10px;background:rgba(167,224,186,.12)}
.track-dots span.done{background:linear-gradient(90deg,#74b997,#a7e0b5)}
.daily-footer p{margin:0;color:#a0bba8;font-size:11px;white-space:nowrap}
.right-stack{display:flex;flex-direction:column;gap:15px}
.progress-panel{flex:1;min-height:200px}
.ring-row{display:flex;align-items:center;gap:23px}
.ring{height:130px;width:130px;position:relative;flex:0 0 130px}
.ring svg{transform:rotate(-90deg);height:100%;width:100%}
.ring .ring-base{fill:none;stroke:rgba(173,225,187,.10);stroke-width:8}
.ring .ring-value{fill:none;stroke:#a5ddb6;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .5s}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:27px;font-weight:660;letter-spacing:-.055em}
.ring-center small{font-size:10px;letter-spacing:0;color:#96bd9e;font-weight:450;margin-top:1px}
.ring-copy strong{font-size:21px;letter-spacing:-.035em;font-weight:630;white-space:nowrap}
.ring-copy span{font-size:12px;color:#95b2a2;line-height:1.6;display:block;margin-top:8px}
.weekly-preview{display:flex;gap:16px;align-items:center;justify-content:space-between;flex:0 0 142px}
.weekly-preview h3{margin:0 0 8px;font-size:16px;font-weight:590}
.weekly-preview p{margin:0;color:#8dab9d;font-size:11px;line-height:1.6;max-width:230px}
.small-arrow{flex:0 0 37px;border-radius:50%;width:37px;height:37px;border:1px solid rgba(176,235,194,.2);display:grid;place-items:center;background:rgba(150,202,172,.09);color:#bce5c8}
.small-arrow svg{width:17px;height:17px}
.footer-credit{font-size:10px;color:#5c8773;text-align:center;letter-spacing:.08em;text-transform:uppercase;margin:28px 0 0}
.page-head{margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.page-desc{font-size:12px;color:#93b0a2;margin:9px 0 0;max-width:670px;line-height:1.7}
.pill,.button{background:rgba(145,208,165,.09);border:1px solid rgba(178,229,188,.2);color:#d5eddb;border-radius:100px;padding:11px 16px;display:inline-flex;align-items:center;gap:7px;font-size:12px;transition:.2s;justify-content:center}
.pill:hover,.button:hover{background:rgba(145,208,165,.17);border-color:rgba(178,229,188,.34)}
.button.primary{color:#113e2c;background:linear-gradient(100deg,#bfe9c9,#91c7a6);border-color:transparent;font-weight:680}
.button.primary:hover{filter:brightness(1.08)}
.button svg,.pill svg{width:15px;height:15px}
.button.danger{color:#f5b5ad;border-color:rgba(242,165,144,.22)}
.view-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.view-grid .wide{grid-column:span 2}
.form-label{font-size:11px;color:#97b5a5;margin-bottom:8px;display:block}
.field{width:100%;border:1px solid rgba(173,223,190,.17);border-radius:11px;background:rgba(3,22,16,.45);color:#f2faf3;padding:12px 13px;min-height:44px}
.field:focus{border-color:#b2e6c0;outline:none}
textarea.field{min-height:95px;resize:vertical}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.form-row{margin-top:17px;display:flex;gap:10px;flex-wrap:wrap}
.section-caption{color:#8daa9c;font-size:12px;line-height:1.6}
.chart-frame{border:1px solid rgba(173,228,193,.1);border-radius:15px;background:rgba(0,25,17,.18);padding:20px 17px;min-height:245px;margin-top:15px}
.chart-svg{width:100%;height:225px;overflow:visible}
.chart-label{fill:#84aa92;font-size:11px;font-family:inherit}
.chart-line{fill:none;stroke:#b1e8bf;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 5px rgba(164,218,182,.22))}
.chart-grid{stroke:rgba(170,223,190,.1);stroke-width:1;stroke-dasharray:4,6}
.chart-point{fill:#c9f1d2;stroke:#194b34;stroke-width:3}
.history-list{width:100%;border-collapse:collapse;margin-top:16px;font-size:12px}
.history-list th{color:#7ca18c;text-transform:uppercase;letter-spacing:.10em;font-size:10px;text-align:left;font-weight:600;padding:12px 10px;border-bottom:1px solid rgba(164,225,191,.12)}
.history-list td{padding:15px 10px;border-bottom:1px solid rgba(164,225,191,.09);color:#c8dfcf}
.history-list td strong{font-weight:650;color:#edf6ef}
.small-action{background:transparent;border:0;color:#a8dbc0;padding:5px 3px;text-align:left}
.photos-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin-top:18px}
.photo{border:1px solid rgba(156,226,179,.13);border-radius:15px;background:rgba(12,49,36,.65);overflow:hidden;position:relative}
.photo img{display:block;width:100%;height:190px;object-fit:cover}
.photo-meta{padding:12px 13px;display:flex;align-items:center;justify-content:space-between;gap:7px}
.photo-meta strong{font-size:11px;font-weight:560}
.photo-meta span{display:block;color:#88a999;font-size:10px;margin-top:3px}
.photo-delete{background:rgba(33,66,49,.8);color:#d9e8d8;border:1px solid rgba(192,239,203,.1);border-radius:9px;width:31px;height:31px;display:grid;place-items:center}
.photo-delete svg{width:15px;height:15px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:17px}
.compare-photo{height:280px;border-radius:14px;border:1px solid var(--line);background:rgba(8,37,26,.55);overflow:hidden;display:grid;place-items:center;color:#8eae9b;font-size:12px}
.compare-photo img{height:100%;width:100%;object-fit:cover}
.compare-label{color:#94b2a1;font-size:11px;margin-top:9px}
.setting{padding:20px 0;border-bottom:1px solid var(--line);display:flex;gap:15px;align-items:center;justify-content:space-between}
.setting:first-child{padding-top:0}
.setting:last-child{border-bottom:0;padding-bottom:0}
.setting strong{font-size:13px;font-weight:570}
.setting p{color:#83a695;font-size:11px;margin:5px 0 0;line-height:1.5;max-width:430px}
.setting-control{flex:0 0 205px}
.switch{position:relative;border-radius:30px;width:45px;height:26px;background:#274d3b;border:1px solid #3d6a51;padding:0;transition:.2s}
.switch:after{content:'';position:absolute;left:4px;top:4px;width:16px;height:16px;background:#719a80;border-radius:50%;transition:.2s}
.switch.on{background:#8bc9a0;border-color:#b8e6c3}
.switch.on:after{transform:translateX(19px);background:#143e2e}
.info-note{padding:15px 17px;border:1px solid rgba(161,227,188,.14);background:rgba(114,178,133,.07);color:#a2c8ae;line-height:1.65;border-radius:13px;font-size:11px;margin-top:16px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:170px;gap:10px;color:#87a897}
.empty svg{width:26px;height:26px;color:#a2d7b3}
.empty strong{color:#d6eade;font-size:14px}
.empty p{font-size:12px;max-width:360px;line-height:1.6;margin:0}
.loading{opacity:.6}
.startup{height:90vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font:45px Georgia,serif;color:#bddfc8}
.startup span{font:13px 'Segoe UI',sans-serif;color:#90b5a2;margin-top:20px}
#toast{position:fixed;bottom:29px;right:32px;background:rgba(25,78,54,.97);border:1px solid rgba(175,233,193,.28);border-radius:13px;padding:13px 18px;color:#e5f6e8;box-shadow:0 12px 45px rgba(0,10,5,.25);z-index:10;font-size:12px;pointer-events:none;opacity:0;transform:translateY(8px);transition:.22s}
#toast.show{opacity:1;transform:none}
@media (max-width:1260px){.hero-focus{display:none}.today-layout{grid-template-columns:1fr}.right-stack{display:grid;grid-template-columns:1fr 1fr}.ring-row{gap:14px}.ring{width:100px;height:100px;flex-basis:100px}.weekly-preview{min-height:170px}.ring-copy strong{font-size:19px}}
@media (max-width:1060px){#app{padding:12px}.shell{grid-template-columns:70px 1fr;gap:12px}.sidebar{padding:20px 10px;top:12px;height:calc(100vh - 24px)}.brand{padding:0 5px 26px}.brand-main,.brand-sub,.nav-head,.nav-label,.side-quote,.profile div:not(.profile-avatar){display:none}.nav-item{justify-content:center;padding:13px 5px}.nav-item svg{width:21px;height:21px}.profile{justify-content:center}.main{padding-right:6px}.metrics{gap:10px}.panel{padding:18px}}
@media (max-width:730px){.shell{display:block}.sidebar{position:relative;min-height:0;height:auto;flex-direction:row;align-items:center;margin-bottom:15px}.brand{padding:0 12px 0 0}.nav{flex-direction:row;flex:1;justify-content:space-around}.sidebar-spacer,.profile{display:none}.topbar{align-items:flex-start}.top-meta{display:none}.hero{min-height:200px;padding:24px}.hero h2{font-size:32px}.metrics,.right-stack,.view-grid{grid-template-columns:1fr}.view-grid .wide{grid-column:span 1}.habit-grid{grid-template-columns:1fr}.photos-grid{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.compare-photo{height:210px}.setting-control{flex:0 0 130px}}

/* GitHub updater — matches the existing evergreen FOCUS visual language */
.button:disabled{opacity:.53;cursor:not-allowed}
.update-track{height:5px;margin-top:4px;border-radius:10px;overflow:hidden;background:rgba(175,226,194,.1)}
.update-track>div{height:100%;border-radius:10px;background:linear-gradient(90deg,#81bf9b,#c2ebcc);transition:width .18s ease}

const browserAPI={
  async load(){try{const j=localStorage.getItem('focus-local-preview-v1');return j?JSON.parse(j):defaultState();}catch{return defaultState()}},

  async importBackup(){return new Promise(resolve=>{const f=document.createElement('input');f.type='file';f.accept='.json';f.onchange=async()=>{try{const backup=JSON.parse(await f.files[0].text());if(backup.format!=='FOCUS-backup-1')throw new Error('Неверный формат');state={...defaultState(),...backup.state};await api.save(state);render();resolve(true)}catch(e){toast(e.message);resolve(false)}};f.click()})},

const api=window.focusDesktop||browserAPI;
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>api.save(state).catch(e=>toast(`Не удалось сохранить: ${e.message}`)),180)}
function toast(message){const el=$('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3500)}
const daysBetween=(a,b)=>Math.floor((fromIso(b)-fromIso(a))/(24*60*60*1000));
function getDaily(s=selectedDate){if(!state.daily[s])state.daily[s]={};return state.daily[s]}
function weeks(){return [...state.weekly].sort((a,b)=>a.date.localeCompare(b.date))}
function measuredWeeks(){return weeks().filter(x=>x.weight!=null&&Number.isFinite(Number(x.weight))&&Number(x.weight)>0)}
function latestWeight(){const arr=measuredWeeks();return arr.length?Number(arr[arr.length-1].weight):Number(state.start.weight)}
function weightDone(){const start=number(state.start.weight),cur=latestWeight(),goal=number(state.settings.targetWeight);if(start===goal)return 100;return clamp(((start-cur)/(start-goal))*100,0,100)}
function weightRemaining(){return Math.max(0,latestWeight()-Number(state.settings.targetWeight))}
function daysWithEntries(){const keys=Object.keys(state.daily).sort();let streak=0;let ptr=fromIso(iso());if(!state.daily[iso()]||!Object.keys(state.daily[iso()]).length)ptr.setDate(ptr.getDate()-1);for(let i=0;i<365;i++){let key=iso(ptr);if(!state.daily[key]||!Object.values(state.daily[key]).some(v=>v!==null&&v!==undefined&&v!==''))break;streak++;ptr.setDate(ptr.getDate()-1)}return streak}
function checks(d){const g=state.settings;return [
  d.calories!=null&&number(d.calories)>0&&number(d.calories)<=number(g.calorieGoal),
  d.treadmill!=null&&number(d.treadmill)>=number(g.treadmillGoal),
  d.alcoholFree===true,
  d.sleep!=null&&number(d.sleep)>=7&&number(d.sleep)<=9,
  d.bedMade===true,d.deskClean===true,
  !!d.wakeTime&&d.wakeTime<='09:00',
  d.noLateFood===true
]}
function topBar(){const pageNames={home:'Главная',daily:'Мои привычки',progress:'Мой прогресс',photos:'Фотографии',settings:'Настройки'};

function side(){const menu=[['home','home','Обзор'],['daily','check','Привычки'],['progress','chart','Прогресс'],['photos','camera','Фотографии'],['settings','settings','Настройки']];const name=state.settings.name||'Данил';return `<aside class="sidebar">

function hero(){const h=new Date().getHours();const greeting=h<11?'Доброе утро':h<17?'Хорошего дня':'Добрый вечер';const n=state.settings.name||'Данил';return `<div class="hero"><div class="hero-text"><div class="date-label">${svg('spark')} НОВЫЙ ДЕНЬ · НОВЫЙ ШАГ</div><h2>${greeting},<br>${esc(n)}.</h2><p>Не нужно быть идеальным. Достаточно двигаться в своём темпе и замечать, как ты меняешься.</p></div><div class="hero-focus">Stay Focused.</div></div>`}
function metricCards(){const cur=latestWeight(),goal=number(state.settings.targetWeight),lost=number(state.start.weight)-cur,wd=weightDone(),streak=daysWithEntries();return `<div class="metrics">
 <div class="tile"><div class="metric-bubble">${svg('weight')}</div><div class="panel-heading">Текущий вес</div><div class="metric-value">${nf(cur)} <small>кг</small></div><div class="metric-detail">Старт ${nf(state.start.weight)} кг · цель ${nf(goal)} кг</div></div>

function dailyView(){const d=getDaily();const done=checks(d),count=done.filter(Boolean).length;const all=Object.entries(state.daily).filter(([k,v])=>Object.values(v).some(x=>x!==null&&x!==undefined&&x!=='')),last14=[];for(let n=13;n>=0;n--){const day=fromIso(iso());day.setDate(day.getDate()-n);const k=iso(day),rec=state.daily[k]||{};last14.push({date:k,done:checks(rec).filter(Boolean).length,filled:Object.values(rec).some(x=>x!==null&&x!==undefined&&x!=='')})}return `<div class="page-head"><div><div class="eyebrow">РИТМ НА КАЖДЫЙ ДЕНЬ</div><p class="page-desc">Восемь привычек, которые ты выбрал сам. Можно выполнять в удобном темпе — и возвращаться к ним после любого перерыва.</p></div>${dateControl()}</div><div class="view-grid"><section class="panel wide"><div class="panel-label"><strong>Отметки за ${prettyDate(selectedDate)}</strong><span>${count} / 8</span></div>${habitTiles(d)}<div class="daily-footer"><div class="track-dots">${done.map(b=>`<span class="${b?'done':''}"></span>`).join('')}</div><p>${count} из 8 целей</p></div></section><section class="panel wide"><div class="panel-label"><strong>Последние 14 дней</strong><span>${all.length} дней с записями всего</span></div><div style="display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:7px;margin-top:18px">${last14.map(x=>`<button title="${prettyDate(x.date)}: ${x.done}/8" data-action="go-date" data-date="${x.date}" style="border:1px solid rgba(168,223,185,.14);border-radius:9px;min-height:62px;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:8px;background:${x.filled?'rgba(121,200,150,.12)':'rgba(120,180,144,.035)'};color:#b7d4c1;padding:8px 3px"><span style="font-size:10px">${x.done}</span><span style="height:${Math.max(4,x.done/8*26)}px;width:8px;border-radius:3px;background:${x.filled?'#a8d8b3':'rgba(139,187,149,.24)'}"></span><span style="font-size:9px">${fromIso(x.date).getDate()}</span></button>`).join('')}</div><p class="section-caption" style="margin:17px 0 0">Число в колонке — количество достигнутых ориентиров. Пустые дни не обнуляют твой прогресс.</p></section></div>`}
function chartSvg(items){if(!items.length)return `<div class="empty">${svg('chart')}<strong>Записей пока нет</strong><p>Добавь первый замер — здесь появится история изменения веса.</p></div>`;
 const width=900,height=225,padX=54,padTop=20,padBottom=37;

 ${[0,items.length-1].filter((v,i,a)=>a.indexOf(v)===i).map(i=>`<text class="chart-label" x="${pts[i][0]}" y="${height-8}" text-anchor="${i===0?'start':'end'}">${prettyDate(items[i].date)}</text>`).join('')}

 <section class="panel"><div class="panel-label"><strong>Добавить фотографию</strong><span>JPG · PNG · WEBP, до 30 МБ</span></div><div class="form-grid">
 <div><label class="form-label" for="photo-date">Дата фотографии</label><input class="field" type="date" id="photo-date" max="${iso()}" value="${iso()}"></div>
 <div><label class="form-label" for="photo-kind">Тип</label><select class="field" id="photo-kind"><option value="face">Лицо</option><option value="body">Фигура</option><option value="other">Другое</option></select></div></div>
 <div class="form-row"><button class="button primary" data-action="photo-add">${svg('plus')} Загрузить фото</button></div></section>
 <div class="section-bar"><h2 class="section-title">Сравнение по датам</h2><span class="section-sub">Два кадра рядом</span></div>
 <section class="panel"><div class="form-grid"><div><label class="form-label">Первая дата</label><select class="field" data-field="compareA">${options.replace(`value="${compareA}"`,`value="${compareA}" selected`)}</select></div><div><label class="form-label">Вторая дата</label><select class="field" data-field="compareB">${options.replace(`value="${compareB}"`,`value="${compareB}" selected`)}</select></div></div>
 <div class="compare">${[compareA,compareB].map(d=>`<div><div class="compare-photo">${selectPhoto(d)?`<img alt="Фото лица за ${prettyDate(d)}" src="${esc(photoSrc(selectPhoto(d)))}">`:`<div class="empty">${svg('camera')}<strong>Нет фотографии</strong><p>Добавь фото лица к этой дате.</p></div>`}</div><div class="compare-label">${d?prettyDate(d,{day:'numeric',month:'long',year:'numeric'}):'Нет даты'}</div></div>`).join('')}</div></section>
 <div class="section-bar"><h2 class="section-title">Твой фотоархив</h2><span class="section-sub">${photos.length} фото</span></div>
 ${photos.length?`<div class="photos-grid">${photos.map(p=>`<div class="photo"><img loading="lazy" src="${esc(photoSrc(p))}" alt="Фото от ${prettyDate(p.date)}"><div class="photo-meta"><div><strong>${p.type==='face'?'Лицо':p.type==='body'?'Фигура':'Другое'}</strong><span>${prettyDate(p.date,{day:'numeric',month:'long',year:'numeric'})}</span></div><button class="photo-delete" title="Удалить фото" data-action="delete-photo" data-date="${p.date}" data-id="${esc(p.id)}">${svg('trash')}</button></div></div>`).join('')}</div>`:`<section class="panel empty">${svg('camera')}<strong>Здесь появятся твои фотографии</strong><p>Можно начать с одного кадра сегодня и вернуться к сравнению через несколько недель.</p></section>`}`}
function toggleSetting(name,label,description,enabled){return `<div class="setting"><div><strong>${label}</strong><p>${description}</p></div><button type="button" role="switch" aria-checked="${!!enabled}" aria-label="${label}" class="switch ${enabled?'on':''}" data-action="setting-toggle" data-key="${name}"></button></div>`}
function updateControls(){
 const u=updateStatus,phase=u.phase;
 const nextAction=phase==='available'?'update-download':phase==='ready'?'update-install':'update-check';
 const label=phase==='available'?'Скачать обновление':phase==='ready'?'Установить и перезапустить':phase==='checking'?'Проверяем…':phase==='downloading'?`Загрузка ${Math.round(u.percent||0)}%`:'Проверить обновления';
 const disabled=['checking','downloading'].includes(phase);
 const message=esc(u.message||'Проверка обновлений через GitHub Releases.');
 return `<div class="section-bar"><h2 class="section-title">Обновления FOCUS</h2></div>
 <section class="panel">
  <div class="setting"><div><strong>Версия ${esc(u.currentVersion||'1.1.0')} · GitHub Releases</strong><p id="focus-update-message" role="status" aria-live="polite">${message}</p></div>
  <button class="button ${phase==='ready'?'primary':''}" data-action="${nextAction}" ${disabled?'disabled':''}>${svg(phase==='ready'?'check':'refresh')}${label}</button></div>
  ${phase==='downloading'?`<div class="update-track" aria-label="Скачивание обновления"><div style="width:${clamp(Number(u.percent)||0,0,100)}%"></div></div>`:''}
  <p class="section-caption" style="margin-top:12px">Проверка выполняется по нажатию кнопки. Новые версии устанавливаются из официальных релизов твоего GitHub-репозитория. Записи, замеры и фотографии не входят в обновление.</p>
 </section>`;
}
function settingsView(){const s=state.settings;return `<div class="page-head"><div><div class="eyebrow">НАСТРОЙ ПОД СЕБЯ</div><p class="page-desc">Это твоё личное пространство. Все цели можно менять, а данные — сохранить в резервной копии.</p></div></div>
 <div class="section-bar"><h2 class="section-title">Личные цели</h2></div>
 <section class="panel"><div class="form-grid">
 <div><label class="form-label">Как к тебе обращаться</label><input class="field" data-field="settings.name" maxlength="50" value="${esc(s.name)}"></div>
 <div><label class="form-label">Целевой вес, кг</label><input type="number" class="field" data-field="settings.targetWeight" min="30" max="250" step="0.1" value="${esc(s.targetWeight)}"></div>
 <div><label class="form-label">Ориентир калорий в день</label><input type="number" class="field" data-field="settings.calorieGoal" min="1000" max="7000" step="50" value="${esc(s.calorieGoal)}"></div>
 <div><label class="form-label">Дорожка, минут в день</label><input type="number" class="field" data-field="settings.treadmillGoal" min="0" max="300" step="5" value="${esc(s.treadmillGoal)}"></div></div>
 <div class="info-note">Твои текущие ориентиры: ${nf(s.calorieGoal,0)} ккал и ${nf(s.treadmillGoal,0)} минут. Оценка самочувствия важнее формального выполнения. При повышенном давлении или плохом самочувствии нагрузку лучше согласовать с врачом.</div></section>
 <div class="section-bar"><h2 class="section-title">Приложение и уведомления</h2></div>
 <section class="panel">
 ${toggleSetting('autoLaunch','Запускать вместе с Windows','FOCUS откроется при входе в Windows (в установленной версии).',s.autoLaunch)}
 ${toggleSetting('notifications','Системные напоминания','Утром, вечером и для еженедельных записей.',s.notifications)}
 ${toggleSetting('sound','Звук уведомлений','Мягкий фирменный трёхнотный сигнал.',s.sound)}
 <div class="setting"><div><strong>Вечернее напоминание</strong><p>Один ненавязчивый сигнал с просьбой отметить день.</p></div><div class="setting-control"><input class="field" data-field="settings.reminderTime" type="time" value="${esc(s.reminderTime)}"></div></div>
 <div class="setting"><div><strong>Еженедельный обзор</strong><p>Выбери день для замера и фото.</p></div><div class="setting-control"><select class="field" data-field="settings.weeklyReminderDay">${[['0','Воскресенье'],['1','Понедельник'],['2','Вторник'],['3','Среда'],['4','Четверг'],['5','Пятница'],['6','Суббота']].map(([n,label])=>`<option value="${n}" ${Number(s.weeklyReminderDay)===Number(n)?'selected':''}>${label}</option>`).join('')}</select><input class="field" style="margin-top:8px" data-field="settings.weeklyReminderTime" type="time" value="${esc(s.weeklyReminderTime)}"></div></div>
 <div class="setting"><div><strong>Проверка звука</strong><p>Послушать мелодию без отправки уведомления.</p></div><button class="button" data-action="test-chime">${svg('bell')} Воспроизвести</button></div>
 </section>
 ${updateControls()}
 <div class="section-bar"><h2 class="section-title">Данные и приватность</h2></div>
 <section class="panel"><div class="setting"><div><strong>Резервная копия</strong><p>Экспорт включает все записи и фотографии. Сохраняй копию в надёжном месте.</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="button" data-action="backup-export">${svg('download')} Экспорт</button><button class="button" data-action="backup-import">${svg('upload')} Импорт</button></div></div><div class="setting"><div><strong>Где лежат твои данные</strong><p>${esc(dataLocation||'Локальное хранилище приложения Windows')}</p></div></div><div class="setting"><div><strong>Очистить данные</strong><p>Удалить записи и историю из приложения. Начальные цели будут восстановлены.</p></div><button class="button danger" data-action="reset-data">${svg('trash')} Сбросить</button></div></section>
 ${!isDesktop?`<div class="info-note">Ты открыл веб-предпросмотр. Для реального автозапуска Windows, системных уведомлений и отдельного хранения фотографий запускай версию Electron из проекта.</div>`:''}`}
function render(){document.title=`FOCUS — ${state.settings.name||'Stay Focused'}`;const contents={home:homeView,daily:dailyView,progress:progressView,photos:photoView,settings:settingsView};$('#app').innerHTML=`<div class="shell">${side()}<main class="main">${topBar()}${(contents[view]||homeView)()}<div class="footer-credit">FOCUS © 2026 · progress is personal</div></main></div>`}
function updateField(field,value){if(field.startsWith('daily.')){
 const prop=field.slice(6),data=getDaily();
 if(['calories','treadmill','sleep'].includes(prop))data[prop]=value===''?null:clamp(number(value),0,prop==='sleep'?24:20000);
 else data[prop]=value||null;
 }else if(field.startsWith('settings.')){
 const prop=field.slice(9);if(['calorieGoal','targetWeight','treadmillGoal','weeklyReminderDay'].includes(prop)){
  const valueNumber=Number(value);if(!Number.isFinite(valueNumber))return;
  const limits={calorieGoal:[1000,7000],targetWeight:[30,250],treadmillGoal:[0,300],weeklyReminderDay:[0,6]};state.settings[prop]=clamp(valueNumber,...limits[prop]);
 }else state.settings[prop]=String(value).slice(0,70);
 }else if(field==='compareA')compareA=value;else if(field==='compareB')compareB=value;
 scheduleSave();render()}
async function addPhoto(date,type){try{
 const result=await api.addPhoto();if(!result)return;
 let wk=state.weekly.find(x=>x.date===date);
 if(!wk){wk={date,weight:null,waist:null,notes:'',photos:[]};state.weekly.push(wk)}
 wk.photos=wk.photos||[];wk.photos.push({...result,type});
 await api.save(state);render();toast('Фотография добавлена в твой архив.');
}catch(e){toast(`Не удалось добавить фото: ${e.message}`)}}
async function handleAction(btn){const action=btn.dataset.action;
 if(action==='navigate'){view=btn.dataset.view||'home';render();window.scrollTo({top:0});return}
 if(action==='toggle'){const d=getDaily(),k=btn.dataset.key;d[k]=d[k]!==true;scheduleSave();render();return}
 if(action==='setting-toggle'){const k=btn.dataset.key;state.settings[k]=!state.settings[k];scheduleSave();render();toast(k==='autoLaunch'&&!isDesktop?'Автозапуск работает в версии Windows.':'Настройка сохранена.');return}
 if(action==='date-prev'||action==='date-next'){const d=fromIso(selectedDate);d.setDate(d.getDate()+(action==='date-prev'?-1:1));const s=iso(d);if(s<=iso()){selectedDate=s;render()}return}
 if(action==='go-date'){selectedDate=btn.dataset.date;render();window.scrollTo({top:0});return}
 if(action==='new-measure'){editWeekDate=iso();render();$('#w-date')?.focus();return}
 if(action==='edit-measure'){editWeekDate=btn.dataset.date;render();$('#w-date')?.focus();return}
 if(action==='photo-add'){const date=$('#photo-date')?.value||iso(),type=$('#photo-kind')?.value||'face';await addPhoto(date,type);return}
 if(action==='photo-add-week'){const date=$('#w-date')?.value||iso();await addPhoto(date,'face');return}
 if(action==='delete-photo'){
  if(!confirm('Удалить эту фотографию из архива?'))return;
  const wk=state.weekly.find(x=>x.date===btn.dataset.date),photo=wk?.photos?.find(p=>p.id===btn.dataset.id);
  if(!photo)return;wk.photos=wk.photos.filter(p=>p.id!==photo.id);
  if(isDesktop)await api.deletePhoto(photo.filename);
  await api.save(state);render();toast('Фотография удалена.');return
 }
 if(action==='update-check'||action==='update-download'||action==='update-install'){
  if(!isDesktop||updateStatus.phase==='unsupported'){toast('Обновления доступны в установленном FOCUS на Windows.');return}
  if(action==='update-install')await api.save(state);
  const actionCall={ 'update-check':()=>api.checkUpdate(), 'update-download':()=>api.downloadUpdate(), 'update-install':()=>api.installUpdate() };
  updateStatus=await actionCall[action]();
  if(view==='settings')render();
  return;
 }
 if(action==='test-chime'){playChime();return}
 if(action==='backup-export'){try{if(await api.exportBackup())toast('Резервная копия сохранена.')}catch(e){toast(e.message)}return}
 if(action==='backup-import'){
  if(!confirm('Импорт заменит текущие записи данными из резервной копии. Продолжить?'))return;
  try{if(await api.importBackup()){state=await api.load();render();toast('Резервная копия восстановлена.')}}catch(e){toast(e.message)}return;
 }
 if(action==='reset-data'){
  if(!confirm('Удалить все привычки, замеры и фотографии из приложения? Это действие нельзя отменить.'))return;
  state=await api.resetData();view='home';render();toast('Записи сброшены.');return;
 }
}
function playChime(){try{const audio=new Audio(window.__focusChimeDataUri||'assets/chime.wav');audio.volume=0.45;audio.play().catch(()=>{});}catch{}}
document.addEventListener('click',async e=>{const btn=e.target.closest('[data-action]');if(!btn)return;if(btn.disabled)return;try{await handleAction(btn)}catch(err){toast(err?.message||'Что-то пошло не так')}});
document.addEventListener('change',e=>{const field=e.target.dataset.field;if(!field)return;updateField(field,e.target.value)});
document.addEventListener('submit',async e=>{
 if(e.target.id!=='weekly-form')return;e.preventDefault();
 const date=$('#w-date').value,weightInput=$('#w-weight').value,waistInput=$('#w-waist').value,notes=$('#w-notes').value;
 if(!date||date>iso()){toast('Укажи корректную дату.');return}
 const weight=weightInput===''?null:Number(weightInput),waist=waistInput===''?null:Number(waistInput);
 if(weight!==null&&(weight<20||weight>400)){toast('Проверь значение веса.');return}
 if(waist!==null&&(waist<30||waist>250)){toast('Проверь значение талии.');return}
 let wk=state.weekly.find(x=>x.date===date);
 if(!wk){wk={date,photos:[]};state.weekly.push(wk)}
 Object.assign(wk,{weight,waist,notes:notes.slice(0,3000)});
 editWeekDate=date;
 try{await api.save(state);render();toast('Замер сохранён. Спасибо, что уделил себе время.')}catch(err){toast(err.message)}
});
(async()=>{
 try{
  const loaded=await api.load();state={...defaultState(),...loaded,settings:{...defaultState().settings,...loaded.settings}};
  dataLocation=await api.dataLocation();
  updateStatus=await api.updateStatus();
  appReady=true;render();
  if(window.focusDesktop){
   api.onChime(playChime);api.onImport(next=>{state=next;render()});
   api.onUpdateStatus(next=>{updateStatus=next;if(view==='settings')render()});
  }
 }catch(err){document.querySelector('#app').textContent=`Не удалось запустить FOCUS: ${err.message}`}
})();
</script>
</body></html>
